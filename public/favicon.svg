<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SEC-DED mark: a bit was hit (red strike), and sits corrected in gold. -->
  <rect width="64" height="64" rx="12" fill="#16211b"/>
  <text x="12" y="45" font-family="ui-monospace, Menlo, monospace" font-size="34" font-weight="600" fill="#e9f1ea">0</text>
  <text x="33" y="45" font-family="ui-monospace, Menlo, monospace" font-size="34" font-weight="600" fill="#e2b93b">1</text>
  <line x1="30" y1="34" x2="56" y2="34" stroke="#ff7a54" stroke-width="3"/>
</svg>
